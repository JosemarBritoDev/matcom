name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Qualidade, Testes e Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalação limpa de dependências
        run: npm ci

      - name: Checagem de tipagem (sem emissão)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testes automatizados
        run: npm test -- --ci --runInBand

      - name: Build de produção
        run: npm run build